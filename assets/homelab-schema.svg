
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="675"
     viewBox="0 0 1200 675"
     role="img" aria-labelledby="t d">
  <title id="t">Architecture du homelab</title>
  <desc id="d">Mes appareils (PC et téléphone) accèdent à un Dell Latitude E5510 sous Debian 13 par Tailscale, un VPN chiffré, sans aucun port ouvert sur la box, et par le réseau local pour le DNS, SSH et les fichiers. Docker Compose héberge AdGuard Home, n8n, Portainer et Glances, dont les interfaces ne sont joignables que via Tailscale. AdGuard Home transmet les requêtes non bloquées à Quad9 en DNS-over-HTTPS. Samba fonctionne directement sur Debian pour les partages de fichiers sur le réseau local.</desc>

  <defs>
    <style>
      .flow {
        stroke-dasharray: 10 6;
        animation: flow 1.2s linear infinite;
      }


      @keyframes flow {
        to {
          stroke-dashoffset: -32;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow {
          animation: none;
        }
      }
    </style>
    <marker id="arrow_vpn" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="8"
            markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f26b21"/>
    </marker>
    <marker id="arrow_lan" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="8"
            markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fb3a9"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">

    <!-- Fond et en-tête -->
    <rect width="1200" height="675" rx="8"
          fill="#0f1820" stroke="#33434a" stroke-width="2"/>
    <rect width="150" height="5" fill="#f26b21"/>

    <text x="44" y="54" font-size="29" font-weight="700"
          fill="#f1f4f2">MON HOMELAB</text>
    <text x="44" y="83" font-size="16"
          fill="#9aa8ad">Infrastructure Linux · Conteneurisation · Réseau et DNS</text>


    <line x1="44" y1="105" x2="1156" y2="105"
          stroke="#33434a" stroke-width="2"/>

    <!-- Mes appareils -->
    <rect x="44" y="178" width="270" height="260" rx="8"
          fill="#18232b" stroke="#4fb3a9" stroke-width="2"/>
    <rect x="44" y="178" width="270" height="6" rx="3"
          fill="#4fb3a9"/>

    <text x="179" y="224" font-size="22" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">Mes appareils</text>
    <text x="179" y="254" font-size="17"
          fill="#9aa8ad" text-anchor="middle">PC et téléphone</text>

    <line x1="74" y1="277" x2="284" y2="277"
          stroke="#33434a"/>

    <text x="179" y="310" font-size="15"
          fill="#f1f4f2" text-anchor="middle">Pubs et traqueurs bloqués</text>
    <text x="179" y="334" font-size="15"
          fill="#f1f4f2" text-anchor="middle">Administration à distance</text>
    <text x="179" y="358" font-size="15"
          fill="#f1f4f2" text-anchor="middle">Même en 4G</text>

    <rect x="64" y="386" width="230" height="34" rx="4"
          fill="#202f36"/>
    <text x="179" y="408" font-size="13"
          fill="#9aa8ad" text-anchor="middle">Aucun port ouvert sur la box</text>

    <!-- Accès Tailscale -->
    <line class="flow" x1="314" y1="256" x2="405" y2="256"
          stroke="#f26b21" stroke-width="3"
          marker-end="url(#arrow_vpn)"/>
    <text x="359" y="235" font-size="15" font-weight="600"
          fill="#ff9b55" text-anchor="middle">Tailscale</text>

    <!-- Accès réseau local -->
    <line class="flow" x1="314" y1="358" x2="405" y2="358"
          stroke="#4fb3a9" stroke-width="3"
          marker-end="url(#arrow_lan)"/>
    <text x="359" y="338" font-size="15" font-weight="600"
          fill="#4fb3a9" text-anchor="middle">LAN</text>

    <!-- Serveur -->
    <rect x="405" y="132" width="751" height="466" rx="8"
          fill="none" stroke="#f26b21"
          stroke-opacity="0.65" stroke-width="2"/>

    <text x="435" y="172" font-size="23" font-weight="700"
          fill="#f1f4f2">Dell Latitude E5510</text>
    <text x="435" y="198" font-size="16"
          fill="#9aa8ad">Debian GNU/Linux 13 · UFW</text>

    <!-- Services Docker -->
    <rect x="430" y="218" width="701" height="250" rx="7"
          fill="#131d25" stroke="#f26b21"
          stroke-opacity="0.8" stroke-width="2"/>

    <text x="455" y="250" font-size="16" font-weight="700"
          letter-spacing="2" fill="#ff9b55">DOCKER COMPOSE</text>
    <text x="1105" y="250" font-size="13"
          fill="#9aa8ad" text-anchor="end">Interfaces Web via Tailscale uniquement</text>

    <!-- AdGuard Home -->
    <rect x="455" y="273" width="153" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="455" y="273" width="153" height="5" rx="2"
          fill="#4fb3a9"/>
    <text x="531" y="316" font-size="18" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">AdGuard Home</text>
    <text x="531" y="345" font-size="14"
          fill="#9aa8ad" text-anchor="middle">DNS filtrant</text>
    <text x="531" y="369" font-size="14"
          fill="#9aa8ad" text-anchor="middle">pubs et traqueurs</text>
    <rect x="467" y="394" width="129" height="28" rx="4"
          fill="#1c302f"/>
    <text x="531" y="413" font-size="13" font-weight="600"
          fill="#4fb3a9" text-anchor="middle">DNS sur le LAN</text>


    <!-- n8n -->
    <rect x="626" y="273" width="153" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="626" y="273" width="153" height="5" rx="2"
          fill="#f26b21"/>
    <text x="702" y="316" font-size="19" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">n8n</text>
    <text x="702" y="345" font-size="14"
          fill="#9aa8ad" text-anchor="middle">Automatisation</text>
    <text x="702" y="369" font-size="14"
          fill="#9aa8ad" text-anchor="middle">de workflows</text>
    <rect x="638" y="394" width="129" height="28" rx="4"
          fill="#30251f"/>
    <text x="702" y="413" font-size="13" font-weight="600"
          fill="#ff9b55" text-anchor="middle">Via Tailscale</text>

    <!-- Portainer -->
    <rect x="797" y="273" width="153" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="797" y="273" width="153" height="5" rx="2"
          fill="#f26b21"/>
    <text x="873" y="316" font-size="18" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">Portainer CE</text>
    <text x="873" y="345" font-size="14"
          fill="#9aa8ad" text-anchor="middle">Administration</text>
    <text x="873" y="369" font-size="14"
          fill="#9aa8ad" text-anchor="middle">des conteneurs</text>
    <rect x="809" y="394" width="129" height="28" rx="4"
          fill="#30251f"/>
    <text x="873" y="413" font-size="13" font-weight="600"
          fill="#ff9b55" text-anchor="middle">Via Tailscale</text>

    <!-- Glances -->
    <rect x="968" y="273" width="137" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="968" y="273" width="137" height="5" rx="2"
          fill="#f26b21"/>
    <text x="1036" y="316" font-size="19" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">Glances</text>
    <text x="1036" y="345" font-size="14"
          fill="#9aa8ad" text-anchor="middle">Supervision</text>
    <text x="1036" y="369" font-size="14"
          fill="#9aa8ad" text-anchor="middle">du serveur</text>
    <rect x="978" y="394" width="117" height="28" rx="4"
          fill="#30251f"/>
    <text x="1036" y="413" font-size="13" font-weight="600"
          fill="#ff9b55" text-anchor="middle">Via Tailscale</text>

    <!-- Samba, service natif Debian -->
    <rect x="430" y="490" width="701" height="80" rx="6"
          fill="#131d25" stroke="#4fb3a9" stroke-width="2"/>

    <rect x="430" y="490" width="6" height="80" rx="3"
          fill="#4fb3a9"/>

    <text x="455" y="523" font-size="20" font-weight="700"
          fill="#f1f4f2">Samba · SSH</text>
    <text x="455" y="548" font-size="15"
          fill="#9aa8ad">Services natifs Debian · Hors Docker</text>

    <line x1="760" y1="507" x2="760" y2="553"
          stroke="#33434a" stroke-width="2"/>

    <text x="785" y="523" font-size="16" font-weight="600"
          fill="#4fb3a9">Partages de fichiers</text>
    <text x="785" y="548" font-size="15"
          fill="#9aa8ad">Administration sur le réseau local</text>

    <!-- Pied de page -->
    <line x1="44" y1="621" x2="1156" y2="621"
          stroke="#33434a" stroke-width="1"/>

    <circle cx="55" cy="646" r="5" fill="#f26b21"/>
    <text x="70" y="651" font-size="14"
          fill="#9aa8ad">Tailscale : accès distant chiffré, aucun port ouvert</text>

    <circle cx="500" cy="646" r="5" fill="#4fb3a9"/>
    <text x="515" y="651" font-size="14"
          fill="#9aa8ad">Réseau local : DNS, SSH et fichiers</text>

    <text x="1155" y="651" font-size="13"
          fill="#9aa8ad" text-anchor="end">Homelab personnel</text>
  </g>
</svg>
