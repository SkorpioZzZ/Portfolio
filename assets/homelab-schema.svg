
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="675"
     viewBox="0 0 1200 675"
     role="img" aria-labelledby="t d">
  <title id="t">Architecture du homelab</title>
  <desc id="d">Un ThinkPad T420s sous Linux Mint administre un Dell Latitude E5510 sous Debian 13. Docker Compose héberge Open WebUI, Ollama et Portainer. Samba fonctionne directement sur Debian pour les partages de fichiers et les sauvegardes sur le réseau local.</desc>

  <defs>
    <marker id="arrow_ssh" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="8"
            markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f26b21"/>
    </marker>
    <marker id="arrow_lan" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="8"
            markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fb3a9"/>
    </marker>
    <marker id="arrow_api" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa8ad"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">

    <!-- Fond et en-tête -->
    <rect width="1200" height="675" rx="8"
          fill="#0f1820" stroke="#33434a" stroke-width="2"/>
    <rect width="150" height="5" fill="#f26b21"/>

    <text x="44" y="54" font-size="29" font-weight="700"
          fill="#f1f4f2">MON HOMELAB</text>
    <text x="44" y="83" font-size="16"
          fill="#9aa8ad">Infrastructure Linux · Conteneurisation · IA locale</text>
    <line x1="44" y1="105" x2="1156" y2="105"
          stroke="#33434a" stroke-width="2"/>

    <!-- Poste client -->
    <rect x="44" y="178" width="270" height="260" rx="8"
          fill="#18232b" stroke="#4fb3a9" stroke-width="2"/>
    <rect x="44" y="178" width="270" height="6" rx="3"
          fill="#4fb3a9"/>

    <text x="179" y="224" font-size="22" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">ThinkPad T420s</text>
    <text x="179" y="254" font-size="17"
          fill="#9aa8ad" text-anchor="middle">Linux Mint</text>

    <line x1="74" y1="277" x2="284" y2="277"
          stroke="#33434a"/>

    <text x="179" y="310" font-size="16" font-weight="600"
          fill="#4fb3a9" text-anchor="middle">Poste client</text>
    <text x="179" y="338" font-size="15"
          fill="#f1f4f2" text-anchor="middle">Administration du serveur</text>
    <text x="179" y="362" font-size="15"
          fill="#f1f4f2" text-anchor="middle">Accès aux interfaces Web</text>

    <rect x="64" y="386" width="230" height="34" rx="4"
          fill="#202f36"/>
    <text x="179" y="408" font-size="13"
          fill="#9aa8ad" text-anchor="middle">Réseau domestique</text>

    <!-- Accès SSH -->
    <line x1="314" y1="256" x2="405" y2="256"
          stroke="#f26b21" stroke-width="3"
          marker-end="url(#arrow_ssh)"/>
    <text x="359" y="235" font-size="15" font-weight="600"
          fill="#ff9b55" text-anchor="middle">SSH</text>

    <!-- Accès réseau local -->
    <line x1="314" y1="358" x2="405" y2="358"
          stroke="#4fb3a9" stroke-width="3"
          marker-end="url(#arrow_lan)"/>
    <text x="359" y="338" font-size="15" font-weight="600"
          fill="#4fb3a9" text-anchor="middle">LAN</text>

    <!-- Serveur -->
    <rect x="405" y="132" width="751" height="466" rx="8"
          fill="none" stroke="#f26b21"
          stroke-opacity="0.65" stroke-width="2"/>

    <text x="435" y="172" font-size="23" font-weight="700"
          fill="#f1f4f2">Dell Latitude E5510</text>
    <text x="435" y="198" font-size="16"
          fill="#9aa8ad">Debian GNU/Linux 13</text>

    <!-- Services Docker -->
    <rect x="430" y="218" width="701" height="250" rx="7"
          fill="#131d25" stroke="#f26b21"
          stroke-opacity="0.8" stroke-width="2"/>

    <text x="455" y="250" font-size="16" font-weight="700"
          letter-spacing="2" fill="#ff9b55">DOCKER COMPOSE</text>
    <text x="1105" y="250" font-size="13"
          fill="#9aa8ad" text-anchor="end">Services conteneurisés</text>

    <!-- Open WebUI -->
    <rect x="455" y="273" width="198" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="455" y="273" width="198" height="5" rx="2"
          fill="#f26b21"/>

    <text x="554" y="316" font-size="19" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">Open WebUI</text>
    <text x="554" y="345" font-size="15"
          fill="#9aa8ad" text-anchor="middle">Interface Web</text>
    <text x="554" y="369" font-size="15"
          fill="#9aa8ad" text-anchor="middle">pour l'IA locale</text>
    <rect x="472" y="394" width="164" height="28" rx="4"
          fill="#30251f"/>
    <text x="554" y="413" font-size="13" font-weight="600"
          fill="#ff9b55" text-anchor="middle">Accès via SSH</text>

    <!-- Ollama -->
    <rect x="681" y="273" width="198" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="681" y="273" width="198" height="5" rx="2"
          fill="#f26b21"/>

    <text x="780" y="316" font-size="20" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">Ollama</text>
    <text x="780" y="345" font-size="15"
          fill="#9aa8ad" text-anchor="middle">Exécution des</text>
    <text x="780" y="369" font-size="15"
          fill="#9aa8ad" text-anchor="middle">modèles IA locaux</text>
    <rect x="698" y="394" width="164" height="28" rx="4"
          fill="#30251f"/>
    <text x="780" y="413" font-size="13" font-weight="600"
          fill="#ff9b55" text-anchor="middle">Service interne</text>

    <!-- Communication Open WebUI / Ollama -->
    <line x1="654" y1="356" x2="679" y2="356"
          stroke="#9aa8ad" stroke-width="2"
          marker-start="url(#arrow_api)"
          marker-end="url(#arrow_api)"/>

    <!-- Portainer -->
    <rect x="907" y="273" width="198" height="166" rx="6"
          fill="#18232b" stroke="#33434a" stroke-width="2"/>
    <rect x="907" y="273" width="198" height="5" rx="2"
          fill="#4fb3a9"/>

    <text x="1006" y="316" font-size="19" font-weight="700"
          fill="#f1f4f2" text-anchor="middle">Portainer CE</text>
    <text x="1006" y="345" font-size="15"
          fill="#9aa8ad" text-anchor="middle">Administration</text>
    <text x="1006" y="369" font-size="15"
          fill="#9aa8ad" text-anchor="middle">des conteneurs</text>
    <rect x="924" y="394" width="164" height="28" rx="4"
          fill="#1c302f"/>
    <text x="1006" y="413" font-size="13" font-weight="600"
          fill="#4fb3a9" text-anchor="middle">Accès via LAN</text>

    <!-- Samba, service natif Debian -->
    <rect x="430" y="490" width="701" height="80" rx="6"
          fill="#131d25" stroke="#4fb3a9" stroke-width="2"/>

    <rect x="430" y="490" width="6" height="80" rx="3"
          fill="#4fb3a9"/>

    <text x="455" y="523" font-size="20" font-weight="700"
          fill="#f1f4f2">Samba</text>
    <text x="455" y="548" font-size="15"
          fill="#9aa8ad">Service natif Debian · Hors Docker</text>

    <line x1="760" y1="507" x2="760" y2="553"
          stroke="#33434a" stroke-width="2"/>

    <text x="785" y="523" font-size="16" font-weight="600"
          fill="#4fb3a9">Partages de fichiers</text>
    <text x="785" y="548" font-size="15"
          fill="#9aa8ad">Sauvegardes sur le réseau local</text>

    <!-- Pied de page -->
    <line x1="44" y1="621" x2="1156" y2="621"
          stroke="#33434a" stroke-width="1"/>

    <circle cx="55" cy="646" r="5" fill="#f26b21"/>
    <text x="70" y="651" font-size="14"
          fill="#9aa8ad">Tunnel SSH : accès aux services Web</text>

    <circle cx="440" cy="646" r="5" fill="#4fb3a9"/>
    <text x="455" y="651" font-size="14"
          fill="#9aa8ad">Réseau local : administration et fichiers</text>

    <text x="1155" y="651" font-size="13"
          fill="#9aa8ad" text-anchor="end">Homelab personnel</text>
  </g>
</svg>
